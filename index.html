<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prokhorov® — Independent Web Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="base-layer" aria-hidden="true"></div>
      <div class="reveal-layer" id="revealLayer" aria-hidden="true"></div>
      <div class="text-container">
        <div class="corner corner-top-left">
          <a href="https://www.linkedin.com/in/helloprokhorov/" aria-label="LinkedIn">LinkedIn</a>
        </div>
        <a class="corner corner-top-right" href="mailto:[placeholder]" aria-label="Contact by email">Contact</a>
        <div class="corner corner-nav-center">
          <a href="https://contra.com/helloprokhorov" aria-label="Contra">Contra</a>
        </div>
        <div class="hero-copy">
          <p>Web &amp; UX/UI Designer<br />Portfolio Updating</p>
          <h1>
            <span>PR<em>O</em>KHOROV</span>
          </h1>
        </div>
      </div>
    </main>
    <script>
      const SPOTLIGHT_R = 260;
      const revealLayer = document.getElementById("revealLayer");
      const mouse = { x: -999, y: -999 };
      const smooth = { x: -999, y: -999 };
      let rafId;

      function renderSpotlight() {
        smooth.x += (mouse.x - smooth.x) * 0.1;
        smooth.y += (mouse.y - smooth.y) * 0.1;
        revealLayer.style.setProperty("--spotlight-x", `${smooth.x}px`);
        revealLayer.style.setProperty("--spotlight-y", `${smooth.y}px`);
        rafId = requestAnimationFrame(renderSpotlight);
      }

      window.addEventListener("mousemove", (event) => {
        mouse.x = event.clientX;
        mouse.y = event.clientY;
      });
      renderSpotlight();

      window.addEventListener("pagehide", () => {
        cancelAnimationFrame(rafId);
      });
    </script>
  </body>
</html>
