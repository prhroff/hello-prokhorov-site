    <!-- Right column on every inner page: availability, the email, profiles -->
    <aside class="doc__aside" aria-label="{{t.get_in_touch}}">
      <div class="doc__aside-in">
        <p class="doc__status"><span class="dot" aria-hidden="true"></span><span>{{t.working_worldwide}}<span class="mute"> · {{t.bishkek}}, <time data-clock>—</time></span></span></p>
        <div class="doc__reach">
          <p class="doc__reach-lead">{{t.reach_lead}}</p>
          <p><span class="reach__mail">{{email}}</span><br><button class="reach__copy" type="button" data-copy="{{email}}"><span data-copy-label>{{t.copy_email}}</span></button></p>
        </div>
        <div class="socials-wrap doc__socials">
          <p class="side__label"><span>{{t.socials}}</span><span>({{profile_count_2}})</span></p>
          <ul class="socials" aria-label="{{t.socials}}">
{{socials}}
          </ul>
        </div>
      </div>
    </aside>
