    <!-- The one site footer, on every page: who made it, the copyright and the privacy
         policy, the hidden game, back to top. No page links: those are in the bar. -->
    <footer class="{{foot_class}}">
      <p><span class="mute">{{t.made_by}}</span> {{t.name}}</p>
      <p class="mute">© {{year}} Prokhorov® · <a class="foot__legal" href="{{privacy_href}}">{{t.privacy}}</a><span data-consent-open hidden> · <button class="foot__cookies" type="button">{{t.cookies}}</button></span><span class="lang" role="group" aria-label="{{lang_switch_label}}"> · {{lang_switch}}</span></p>
      <div class="foot__game">
        <!-- Opens Invader, the hidden 8-bit game (js/game/, loaded on first click) -->
        <button class="foot__play" type="button" data-game aria-haspopup="dialog" aria-label="{{t.game_label}}">
          <svg class="foot__invader" width="22" height="16" viewBox="0 0 22 16" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><path class="foot__frame" d="M4 0h2v1h-2zM16 0h2v1h-2zM4 1h2v1h-2zM16 1h2v1h-2zM6 2h2v1h-2zM14 2h2v1h-2zM6 3h2v1h-2zM14 3h2v1h-2zM4 4h14v1h-14zM4 5h14v1h-14zM2 6h5v1h-5zM9 6h4v1h-4zM15 6h5v1h-5zM2 7h5v1h-5zM9 7h4v1h-4zM15 7h5v1h-5zM0 8h22v1h-22zM0 9h22v1h-22zM0 10h2v1h-2zM4 10h14v1h-14zM20 10h2v1h-2zM0 11h2v1h-2zM4 11h14v1h-14zM20 11h2v1h-2zM0 12h2v1h-2zM4 12h2v1h-2zM16 12h2v1h-2zM20 12h2v1h-2zM0 13h2v1h-2zM4 13h2v1h-2zM16 13h2v1h-2zM20 13h2v1h-2zM6 14h4v1h-4zM12 14h4v1h-4zM6 15h4v1h-4zM12 15h4v1h-4z"/><path class="foot__frame foot__frame--b" d="M4 0h2v1h-2zM16 0h2v1h-2zM4 1h2v1h-2zM16 1h2v1h-2zM0 2h2v1h-2zM6 2h2v1h-2zM14 2h2v1h-2zM20 2h2v1h-2zM0 3h2v1h-2zM6 3h2v1h-2zM14 3h2v1h-2zM20 3h2v1h-2zM0 4h2v1h-2zM4 4h14v1h-14zM20 4h2v1h-2zM0 5h2v1h-2zM4 5h14v1h-14zM20 5h2v1h-2zM0 6h7v1h-7zM9 6h4v1h-4zM15 6h7v1h-7zM0 7h7v1h-7zM9 7h4v1h-4zM15 7h7v1h-7zM0 8h22v1h-22zM0 9h22v1h-22zM2 10h18v1h-18zM2 11h18v1h-18zM4 12h2v1h-2zM16 12h2v1h-2zM4 13h2v1h-2zM16 13h2v1h-2zM2 14h2v1h-2zM18 14h2v1h-2zM2 15h2v1h-2zM18 15h2v1h-2z"/></svg>
          <span class="foot__play-label" data-roll>{{t.game}}</span>
        </button>
      </div>
      <a class="foot__top" href="#top" data-roll>{{t.to_top}}</a>
    </footer>
