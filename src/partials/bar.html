  <!-- ============ TOP BAR ============
       Its three cells sit on the three columns of the page below. The page
       links come from NAV in scripts/site.py. -->
  <header class="bar" data-nav>
    <a class="bar__brand" href="{{brand_href}}" aria-label="{{brand_label}}"><span class="logo"><svg class="logo__mark" viewBox="1 0 47 48" aria-hidden="true" focusable="false"><use href="#pk-mark"/></svg><svg class="logo__word" viewBox="54 13 181 22" aria-hidden="true" focusable="false"><use href="#pk-word"/></svg></span></a>
    <nav class="bar__nav" aria-label="{{t.nav_primary}}">
{{nav_bar}}
    </nav>
    <p class="bar__time">{{t.bishkek}}, <time data-clock>—</time></p>
    <p class="bar__end"><span class="bar__lang" role="group" aria-label="{{lang_switch_label}}">{{lang_bar}}</span><a class="bar__cta" data-roll href="{{cta_href}}">{{t.get_in_touch}}</a></p>
    <button class="bar__toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="{{t.menu}}" data-menu-toggle><span class="bar__toggle-label" aria-hidden="true"><span>{{t.menu}}</span><span>{{t.close}}</span></span><span class="bar__toggle-icon" aria-hidden="true"><i></i><i></i></span></button>
  </header>
