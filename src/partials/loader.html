  <!-- ============ PRELOADER ============
       Counts the real loading (font, first images), then lifts away.
       Hidden without JS; hides itself after 6s if the script never runs. -->
  <div class="loader" data-loader aria-hidden="true">
    <div class="loader__top"><span class="loader__brand"><span class="logo"><svg class="logo__mark" viewBox="1 0 47 48" aria-hidden="true" focusable="false"><use href="#pk-mark"/></svg><svg class="logo__word" viewBox="54 13 181 22" aria-hidden="true" focusable="false"><use href="#pk-word"/></svg></span></span><span class="loader__time">{{t.bishkek}}, <time data-clock>—</time></span></div>
    <div class="loader__bottom">
      <span class="loader__count" data-loader-count>000</span>
    </div>
  </div>
